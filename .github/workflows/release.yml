name: Release Grapho

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to update"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb,rpm,appimage
          - os: windows-2025
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev libayatana-appindicator3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Grapho ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: |
            # Grapho v1.0.0

            Grapho is a local-first writing application for turning ideas into finished documents.

            ## Included

            - Focused block-based writing workspace
            - Projects, folders, nested documents, search, backlinks, and trash recovery
            - Markdown, HTML, plain text, JSON backup, and PDF print export
            - Light and dark themes
            - Keyboard shortcuts and command palette
            - Desktop onboarding and workspace tool guide
            - Local persistence without an account or hosted workspace

            ## Downloads

            - Ubuntu and Debian: DEB package
                        - Fedora and RPM-based distributions: RPM package
                        - Arch and other Linux distributions: AppImage
            - Windows: NSIS installer

            ## Notes

            Grapho stores workspace data locally. Export or back up important documents before major system changes.
          releaseDraft: false
          prerelease: false
          includeDebug: false
          includeRelease: true
          args: --bundles ${{ matrix.bundle }}

  android:
    name: Build Android
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize Android target
        run: npx tauri android init --ci

      - name: Restore Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/grapho-release.keystore"

      - name: Build signed Android APKs
        env:
          TAURI_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/grapho-release.keystore
          TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAURI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npx tauri android build --ci --apk --split-per-abi

      - name: Upload Android release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: >-
          gh release upload "$RELEASE_TAG"
          src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk
          src-tauri/gen/android/app/build/outputs/bundle/*Release/*.aab
          --clobber
